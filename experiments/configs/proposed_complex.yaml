# Milestone 3 methodology; FB15k-237 and ComplEx by project decision.
# kg_dim=32 packs 16 real and 16 imaginary coordinates.
dataset: fb15k237
raw_dir: data/raw/fb15k237
text_dir: data/text/fb15k237
download_if_missing: true
output_dir: experiments/runs/proposed_complex
variant: proposed
scorer: complex
kg_dim: 32
lm_name: roberta-base
max_text_length: 64
lm_micro_batch: 4
lm_activation_checkpointing: true
rgat_heads: 2
layers_per_phase: 1
num_blocks: null
block_target_width: 4
attention_dropout: 0.10
feature_dropout: 0.10
warmup_epochs: 10
mp_ratio: 0.90
neighbors_per_hop: 2
train_batch_size: 8
num_negatives: 4
balanced_head_tail_negatives: true
max_epochs: 300
eval_every: 5
early_stopping_patience: 12
lr: 0.001
weight_decay: 0.0
grad_clip_norm: 1.0
use_amp: true
eval_node_batch_size: 128
eval_triple_batch_size: 64
checkpoint_every: 1
seed: 42
device: auto
